version: '3.8'

services:
  abaya-track:
    container_name: abaya-track-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    restart: unless-stopped
    volumes:
      # Map data and uploads so that offline logs, snapshots, and uploaded images persist
      - ../data:/app/data
      - ../public/uploads:/app/public/uploads
    command: node server.js
