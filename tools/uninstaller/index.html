<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>AbaYa Track Uninstaller</title>
<style>
  :root {
    --bg: #0f0c1a;
    --s1: #1c1530;
    --s2: #261b40;
    --s3: #362a5b;
    --bd: rgba(106,95,193,0.25);
    --bd2: rgba(167,139,250,0.35);
    --tx: #ffffff;
    --tx2: #e5e7eb;
    --tx3: #9c98b0;
    --label: #c4b5fd;
    --gr: #c2ef4e;
    --rd: #ef4444;
    --am: #ffb287;
    --pu: #a78bfa;
    --focus: #fa7faa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--tx); font-family: 'Rubik', -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.45; height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { background: linear-gradient(135deg, #1c1530 0%, #0f0c1a 100%); border-bottom: 1px solid var(--bd); padding: 18px 22px; }
  header h1 { font-family: 'Sora', 'Rubik', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  header .sub { color: var(--tx3); font-size: 12px; margin-top: 4px; }
  main { flex: 1; padding: 18px 22px; overflow-y: auto; }
  footer { background: var(--s1); border-top: 1px solid var(--bd); padding: 14px 22px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .group { background: var(--s1); border: 1px solid var(--bd); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  .group h2 { font-size: 14px; color: var(--label); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .group h2 .pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--s3); color: var(--tx2); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--bd); }
  .row:first-of-type { border-top: 0; }
  .row .label { flex: 1; min-width: 0; }
  .row .label .name { font-size: 13px; color: var(--tx); font-weight: 600; }
  .row .label .path { font-size: 11px; color: var(--tx3); font-family: 'JetBrains Mono', Monaco, Menlo, monospace; word-break: break-all; }
  .row .meta { font-size: 11px; color: var(--tx3); margin-top: 2px; }
  .row .size { font-size: 12px; color: var(--label); min-width: 70px; text-align: right; font-family: 'JetBrains Mono', monospace; }
  .row .actions { display: flex; gap: 6px; }
  .choice { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; font-size: 11.5px; font-weight: 600; border-radius: 8px; border: 1px solid var(--bd2); background: var(--s2); color: var(--tx2); cursor: pointer; user-select: none; }
  .choice input { accent-color: var(--pu); }
  .choice.danger { border-color: rgba(239,68,68,0.35); color: var(--rd); }
  .choice.danger input { accent-color: var(--rd); }
  .btn { font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--bd2); background: var(--s2); color: var(--tx); cursor: pointer; }
  .btn.primary { background: linear-gradient(135deg, #6a5fc1, #422082); border-color: rgba(106,95,193,0.6); }
  .btn.danger { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.45); color: var(--rd); }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .summary { font-size: 12px; color: var(--tx2); }
  .banner { padding: 10px 14px; border-radius: 10px; font-size: 12.5px; margin-bottom: 14px; }
  .banner.warn { background: rgba(255,178,135,0.1); border: 1px solid rgba(255,178,135,0.35); color: var(--am); }
  .banner.ok { background: rgba(194,239,78,0.1); border: 1px solid rgba(194,239,78,0.35); color: var(--gr); }
  .empty { color: var(--tx3); font-size: 12.5px; padding: 6px 0; }
  .confirm-overlay { position: fixed; inset: 0; background: rgba(15,12,26,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .confirm-box { background: var(--s1); border: 1px solid var(--bd2); border-radius: 14px; padding: 22px 26px; max-width: 540px; }
  .confirm-box h3 { color: var(--am); margin-bottom: 8px; font-size: 16px; }
  .confirm-box .body { color: var(--tx2); font-size: 12.5px; margin-bottom: 14px; }
  .confirm-box .body ul { padding-left: 18px; margin: 6px 0; }
  .confirm-box .body li { padding: 2px 0; }
  .confirm-box .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .results { font-size: 12px; color: var(--tx2); background: var(--s2); border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
  .results .ok { color: var(--gr); }
  .results .err { color: var(--rd); }
  .pill-tag { font-size: 9.5px; padding: 2px 7px; border-radius: 10px; background: var(--s3); color: var(--label); margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>AbaYa Track Uninstaller</h1>
  <div class="sub" id="headerSub">Detecting installed app and data&hellip;</div>
</header>

<main id="main">
  <div class="banner warn" id="detectBanner" style="display:none"></div>
  <div id="groups"></div>
</main>

<footer>
  <div class="summary" id="footerSummary">Default: keep everything. No data is touched until you click Apply.</div>
  <div style="flex:1"></div>
  <button class="btn ghost" id="openAuditBtn" type="button">Open audit log</button>
  <button class="btn danger" id="applyBtn" type="button" disabled>Apply choices</button>
</footer>

<div class="confirm-overlay" id="confirmOverlay" style="display:none">
  <div class="confirm-box">
    <h3>Confirm destructive actions</h3>
    <div class="body" id="confirmBody"></div>
    <div class="actions">
      <button class="btn ghost" id="confirmCancel" type="button">Cancel</button>
      <button class="btn danger" id="confirmOk" type="button">Yes, do it</button>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
