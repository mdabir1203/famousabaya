name = "abaya-dispatch-worker"
main = "cloud-worker/index.js"
compatibility_date = "2024-11-01"

# ─── Custom Domain (Optional — e.g. api.farewellabaya.com) ────────────────────
# pattern = "api.farewellabaya.com"
# custom_domain = true

[vars]
# Secret token used by Cloud Worker to authenticate requests to the local Bun server
# Set DISPATCH_BRIDGE_SECRET as a secret: npx wrangler secret put DISPATCH_BRIDGE_SECRET
# Set WHATSAPP_VERIFY_TOKEN as a secret: npx wrangler secret put WHATSAPP_VERIFY_TOKEN
# Set WHATSAPP_TOKEN as a secret: npx wrangler secret put WHATSAPP_TOKEN
DEFAULT_SLA_HOURS = "4"

# ─── D1 Database ──────────────────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "abaya-db"
database_id   = "5d61fb15-2ead-491b-80e2-fe2b2fd46d23"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
