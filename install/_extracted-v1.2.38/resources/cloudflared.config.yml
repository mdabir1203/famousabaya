# Template for factory HTTPS/WSS (kiosk PWA at https://kiosk.farewellabaya.com needs wss://).
# Prefer: install\SETUP-CLOUDFLARE-TUNNEL-FACTORY-API.ps1 on the factory PC (writes %USERPROFILE%\.cloudflared\config.yml).
# Copy to %USERPROFILE%\.cloudflared\config.yml and replace TUNNEL_UUID + credentials path.
#
# Public hostname below must match:
#   - Tablet / QR "Factory API" field on http://<factory-pc>:3000/setup
#   - kiosk-pwa/index.html meta name="abaya-factory-api-base" (redeploy Pages if you change it)
#
# Do NOT route kiosk.farewellabaya.com here (that hostname is Cloudflare Pages).
# dashboard.farewellabaya.com is the CEO Worker — not this tunnel.

tunnel: YOUR_TUNNEL_UUID
credentials-file: C:\Users\YOUR_WINDOWS_USER\.cloudflared\YOUR_TUNNEL_UUID.json

ingress:
  - hostname: api.farewellabaya.com
    service: http://127.0.0.1:3000
    originRequest:
      noHappyEyeballs: true
      connectTimeout: 30s
      tlsTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
  - service: http_status:404
