directories:
  output: ../../install
  buildResources: build
appId: com.abaya.track.launcher
productName: AbaYa Track Launcher
icon: assets/app-icon
files:
  - filter:
      - index.html
      - main.js
      - update-policy.cjs
      - preload.js
      - renderer.js
      - start-electron.cjs
      - package.json
      - update-policy.cjs
      - README.md
extraResources:
  - from: ../../install
    to: install
    filter:
      - '*.bat'
      - '*.ps1'
      - '*.cjs'
  - from: ../../server.js
    to: server.js
  - from: ../../package.json
    to: package.json
  - from: ../../.env.example
    to: .env.example
  - from: ../../public
    to: public
    filter:
      - '**/*.{html,js,css,png,jpg,jpeg,svg,ico,json}'
  - from: ../../shared
    to: shared
    filter:
      - '**/*.{js,cjs,mjs}'
  - from: ../../config
    to: config
    filter:
      - '**/*.json'
  - from: ../../tools/catalog-watcher
    to: tools/catalog-watcher
    filter:
      - '*.js'
      - '*.json'
      - package.json
  - from: .factory-deps/node_modules
    to: node_modules
publish:
  - provider: github
    owner: mdabir1203
    repo: famousabaya
    releaseType: release
extraMetadata:
  main: main.js
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AbaYa-Track-Launcher-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AbaYa Track Launcher
electronVersion: 34.5.8
