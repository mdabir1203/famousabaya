nodeLinker: pnp
cacheFolder: ./.yarn/cache
enableGlobalCache: false

# @cloudflare/unenv-preset lists unenv as peerOnly; Wrangler's bundler then sees
# ["unenv", null] in PnP and cannot resolve unenv/node/*. Promote to a hard dep.
packageExtensions:
  "@cloudflare/unenv-preset@*":
    dependencies:
      unenv: "2.0.0-rc.24"
  # Wrangler bundles esbuild; under Yarn PnP, nested require('esbuild') must resolve.
  "wrangler@*":
    dependencies:
      esbuild: "*"
