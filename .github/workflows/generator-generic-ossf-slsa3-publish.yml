# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow generates SLSA provenance for your project at Level 3.
# Spec: https://slsa.dev/spec/v0.1/requirements
# Generator: https://github.com/slsa-framework/slsa-github-generator
# Verifier:  https://github.com/slsa-framework/slsa-verifier

name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # FIX 1: was `steps.hash.outputs.digests` — the step emits `hashes`
      digests: ${{ steps.hash.outputs.hashes }}

    steps:
      # FIX 2: pin checkout to a full commit SHA (mutable tags violate SLSA L3)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ============================================================
      # Step 1: Build your artifacts.
      # Replace this section with your real build commands.
      # ============================================================
      - name: Build artifacts
        run: |
          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      # ============================================================
      # Step 2: Generate provenance subjects.
      # List every binary/file you want provenance for in `sha256sum`.
      # ============================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          files=$(ls artifact*)
          # FIX 1 (same): output key is `hashes`, matching the job-output mapping above
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # Required: read the workflow path for provenance
      id-token: write # Required: sign the provenance via OIDC
      contents: write # Required: upload attestation to the release

    # FIX 3: upgraded from v1.4.0 → v2.0.0
    # FIX 4: pinned to a commit SHA — the tag alone is mutable and unsafe
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      # FIX 5: only upload assets when a real release triggered this run;
      #         workflow_dispatch has no release to attach assets to.
      upload-assets: ${{ github.event_name == 'release' }}
