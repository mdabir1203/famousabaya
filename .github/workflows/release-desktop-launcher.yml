name: QA/QC and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Enable Corepack and activate Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run QA/QC pipeline
        run: yarn qa:qc:ci

  build-and-publish:
    needs: qa-qc
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      ABAYA_UPDATE_CHANNEL: ${{ contains(github.ref_name, 'beta') && 'beta' || 'stable' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Enable Corepack and activate Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --


      - name: Verify yarn version 37	        
        run: yarn --version    
          

      - name: Install launcher dependencies
        working-directory: tools/desktop-launcher
        run: yarn install

      - name: Generate self-signed Windows certificate
        shell: pwsh
        run: |
          $certDir = Join-Path $env:GITHUB_WORKSPACE 'dist/cert'
          New-Item -ItemType Directory -Path $certDir -Force | Out-Null
          $certPath = Join-Path $certDir 'AbaYaTrackSelfSigned.pfx'
          $password = 'AbaYa-Track-Self-Signed-2026!'
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = New-SelfSignedCertificate -CertStoreLocation Cert:\CurrentUser\My -Type CodeSigningCert -Subject "CN=AbaYa Track Self Signed" -KeyUsage DigitalSignature -FriendlyName "AbaYa Track Self Signed" -KeyExportPolicy Exportable -Provider "Microsoft Enhanced RSA and AES Cryptographic Provider"
          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $securePassword | Out-Null
          echo "CSC_LINK=$certPath" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$password" >> $env:GITHUB_ENV
          echo "WIN_CSC_LINK=$certPath" >> $env:GITHUB_ENV

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version=$(node -p "require('./tools/desktop-launcher/package.json').version")
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          node scripts/generate-release-notes.mjs --tag "${{ steps.release-version.outputs.tag }}" --version "${{ steps.release-version.outputs.version }}" --output release-notes.md
          echo "Release notes generated."

      - name: Skip release if version already exists
        id: check-release
        shell: bash
        run: |
          tag="${{ steps.release-version.outputs.tag }}"
          echo "Checking for existing GitHub release tag $tag..."
          release=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$tag")
          if echo "$release" | grep -q '"message": "Not Found"'; then
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release stub
        if: steps.check-release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release-version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Release $tag" --notes-file release-notes.md --draft=false
          else
            gh release create "$tag" --title "Release $tag" --notes-file release-notes.md
          fi

      - name: Build and publish signed launcher
        if: steps.check-release.outputs.release_exists == 'false'
        working-directory: tools/desktop-launcher
        run: yarn release:gh

      - name: Build portable ZIP release artifact
        if: steps.check-release.outputs.release_exists == 'false'
        shell: pwsh
        run: |
          $env:Path += ";$env:ProgramFiles\PowerShell\7"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1

      - name: Upload portable ZIP to release
        if: steps.check-release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.release-version.outputs.tag }}"
          zip_path="dist/AbaYa-Track-v${{ steps.release-version.outputs.version }}.zip"
          if [ -f "$zip_path" ]; then
            gh release upload "$tag" "$zip_path" --clobber
          else
            echo "Portable ZIP artifact not found at $zip_path"
            exit 1
          fi

      - name: Verify GitHub release exists
        if: steps.check-release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.release-version.outputs.tag }}"
          echo "Verifying GitHub release $tag exists..."
          gh release view "$tag"

      - name: Release already exists
        if: steps.check-release.outputs.release_exists == 'true'
        run: echo "Release for version ${{ steps.release-version.outputs.version }} already exists. Skipping publish."
