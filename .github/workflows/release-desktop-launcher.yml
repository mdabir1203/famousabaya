name: 🚀 Auto-Release Desktop Launcher

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # 1. QA / QC GATE
  # ============================================================

  qa-qc:
    name: 🔍 QA / QC
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must run before setup-node because setup-node's Yarn cache
      # invokes Yarn while calculating the cache key.
      - name: 🟢 Enable Corepack
        run: corepack enable

      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: yarn

      - name: 🧶 Activate Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: 📦 Install Dependencies
        run: yarn install --immutable

      - name: 🧪 Run QA / QC Pipeline
        run: yarn qa:qc:ci


  # ============================================================
  # 2. WINDOWS BUILD + RELEASE
  # ============================================================

  build-and-release:
    name: 🚀 Build & Release Desktop Launcher
    needs: qa-qc

    runs-on: windows-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ----------------------------------------------------------
      # NODE + YARN
      # ----------------------------------------------------------

      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: 🧶 Enable Corepack + Yarn 4.13.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version


      # ----------------------------------------------------------
      # INSTALL LAUNCHER DEPENDENCIES
      # ----------------------------------------------------------

      - name: 📦 Install Launcher Dependencies
        working-directory: tools/desktop-launcher
        run: yarn install --immutable


      # ----------------------------------------------------------
      # MATERIALIZE install/.env.production FROM TEMPLATE
      # ----------------------------------------------------------
      # install/.env.production is .gitignored (because the previous version
      # shipped with a real GH_TOKEN in it; that PAT has since been revoked).
      # The committed template (install/.env.production.template) carries only
      # the non-secret defaults (HOST/PORT/LAN_IP/CF_INGEST_SECRET/...). The
      # release CI copies the template into place so electron-builder's
      # extraResources entry has a file to bundle, and env-migrate on the
      # factory still has a real CF_INGEST_SECRET to seed a fresh .env with.

      - name: 📝 Materialize .env.production from template
        shell: pwsh
        run: |
          if (!(Test-Path "install/.env.production.template")) {
            Write-Error "install/.env.production.template is missing from the repo. CI cannot materialize .env.production."
            exit 1
          }
          New-Item -ItemType Directory -Path "install" -Force | Out-Null
          Copy-Item "install/.env.production.template" "install/.env.production" -Force
          Write-Host "Materialized install/.env.production from template ($( (Get-Item 'install/.env.production').Length ) bytes)."


      # ----------------------------------------------------------
      # BUNDLE FACTORY DEPS (tools/desktop-launcher/.factory-deps/)
      # ----------------------------------------------------------
      # electron-builder's extraResources entry reads from
      # tools/desktop-launcher/.factory-deps/node_modules. That directory is
      # .gitignored because it's ~200 MB of runtime deps. scripts/bundle-factory.mjs
      # uses plain `npm install --omit=dev` (NOT yarn PnP, which Electron
      # can't run from a virtual zipfs path) to materialise it on the runner
      # before electron-builder reads it. Without this step the install ships
      # with an empty resources/node_modules and PM2 falls back to "inline
      # spawn" (v1.2.19 → v1.2.20 release notes bug #1).

      - name: 📦 Bundle factory runtime deps
        shell: pwsh
        run: |
          node scripts/bundle-factory.mjs
          if (!(Test-Path "tools/desktop-launcher/.factory-deps/node_modules/express")) {
            Write-Error "bundle-factory.mjs did not produce .factory-deps/node_modules/express"
            exit 1
          }
          $count = (Get-ChildItem "tools/desktop-launcher/.factory-deps/node_modules" -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host ".factory-deps ready: $count top-level packages."


      # ----------------------------------------------------------
      # BUNDLE CATALOG-WATCHER DEPS (tools/catalog-watcher/node_modules)
      # ----------------------------------------------------------
      # The catalog-watcher is the office-side tool that watches the abaya
      # catalog folder for .xlsx changes and pushes to the cloud. It has
      # its own dependencies (chokidar, xlsx) that need to be in the install.
      # We switched the watcher to `nodeLinker: node-modules` so the deps
      # materialize as a real node_modules tree. CI runs `npm install
      # --omit=dev` in the watcher dir; the result is bundled via the
      # extraResources `node_modules/**/*` filter.

      - name: 📦 Bundle catalog-watcher deps
        shell: pwsh
        run: |
          Push-Location tools/catalog-watcher
          npm install --omit=dev --no-audit --no-fund --loglevel=error
          Pop-Location
          if (!(Test-Path "tools/catalog-watcher/node_modules/chokidar")) {
            Write-Error "catalog-watcher deps did not materialize (node_modules/chokidar missing)"
            exit 1
          }
          $count = (Get-ChildItem "tools/catalog-watcher/node_modules" -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "catalog-watcher node_modules ready: $count top-level packages."


      # ----------------------------------------------------------
      # READ CANONICAL VERSION FROM package.json
      # Single source of truth: tools/desktop-launcher/package.json
      # Releases always tag exactly that version (e.g. v1.2.7) — no
      # timestamped variants. This keeps auto-update `latest.yml`
      # aligned with the actual built EXE and prevents version drift.
      # ----------------------------------------------------------

      - name: 🏷️ Read Canonical Launcher Version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content `
            "$env:GITHUB_WORKSPACE/tools/desktop-launcher/package.json" `
            -Raw | ConvertFrom-Json

          $raw = $pkg.version.Trim()
          if ([string]::IsNullOrWhiteSpace($raw)) {
            Write-Error "tools/desktop-launcher/package.json is missing a 'version' field"
            exit 1
          }

          $tag = "v$raw"
          Write-Host "=========================================="
          Write-Host "Canonical launcher version: $raw"
          Write-Host "Release tag:               $tag"
          Write-Host "=========================================="

          # IMPORTANT: $GITHUB_OUTPUT is a key=value-per-line file. Each
          # value MUST end with a newline, or the next key gets glued to
          # the previous one. Don't use -NoNewline here, or every later
          # step that reads ${{ steps.version.outputs.version }} gets
          # "1.2.10tag=v1.2.10" instead of "1.2.10".
          "version=$raw" | Out-File -FilePath "$env:GITHUB_OUTPUT" -Encoding utf8 -Append
          "tag=$tag"     | Out-File -FilePath "$env:GITHUB_OUTPUT" -Encoding utf8 -Append


      # ----------------------------------------------------------
      # WINDOWS CODE SIGNING
      # ----------------------------------------------------------
      # The signing cert is now stored as a stable GitHub Secret
      # (CSC_LINK_BASE64 + CSC_KEY_PASSWORD) so every CI run signs with
      # the SAME key. Previous behaviour generated a fresh self-signed
      # cert on every run, which forced every install to "uninstall +
      # reinstall" because the publisher key had changed (the doom loop
      # reported in v1.2.19 → v1.2.20 release notes).
      # electron-builder auto-detects CSC_LINK_BASE64 + CSC_KEY_PASSWORD
      # and writes the decoded pfx to a temp path for signtool.

      # ----------------------------------------------------------
      # RELEASE NOTES
      # ----------------------------------------------------------

      - name: 📝 Generate Release Notes
        shell: bash
        run: |

          node scripts/generate-release-notes.mjs \
            --tag "${{ steps.version.outputs.tag }}" \
            --version "${{ steps.version.outputs.version }}" \
            --output release-notes.md

          echo "Release notes generated successfully."


      # ----------------------------------------------------------
      # BUILD ELECTRON WINDOWS LAUNCHER
      # ----------------------------------------------------------

      - name: 🛠️ Build Signed Launcher (no auto-publish)
        working-directory: tools/desktop-launcher
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # electron-builder 24.13.3 reads CSC_LINK as a FILE PATH (no
          # CSC_LINK_BASE64 support). Decode the base64 secret into a
          # throwaway .pfx on the runner, then point CSC_LINK / WIN_CSC_LINK
          # at that path. The pfx is written to the runner's temp dir
          # and never committed; workflow cleanup removes it.
          CSC_LINK: ${{ runner.temp }}\cert\abaya.pfx
          WIN_CSC_LINK: ${{ runner.temp }}\cert\abaya.pfx
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "cert\abaya.pfx"
          New-Item -ItemType Directory -Path (Split-Path $pfxPath) -Force | Out-Null
          $b64 = '${{ secrets.CSC_LINK_BASE64 }}'.Trim()
          # Strip a leading UTF-8 BOM if `gh secret set` happened to store one —
          # [Convert]::FromBase64String is strict and rejects it with a confusing
          # "non-base 64 character" error.
          if ($b64.Length -gt 0 -and $b64[0] -eq [char]0xFEFF) { $b64 = $b64.Substring(1) }
          $b64 = $b64 -replace '\s', ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          Write-Host "Materialized pfx at $pfxPath ($((Get-Item $pfxPath).Length) bytes)"

          yarn release:gh


      # ----------------------------------------------------------
      # BUILD PORTABLE ZIP
      # ----------------------------------------------------------

      - name: 📦 Build Portable ZIP
        shell: pwsh
        run: |

          $env:Path += ";$env:ProgramFiles\PowerShell\7"

          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File scripts/build-release.ps1 `
            -Version "${{ steps.version.outputs.version }}"


      # ----------------------------------------------------------
      # VERIFY BUILD ARTIFACTS
      # ----------------------------------------------------------

      - name: 🔎 Verify Build Artifacts
        shell: pwsh
        run: |

          $VERSION = "${{ steps.version.outputs.version }}"
          Write-Host "=========================================="
          Write-Host "Verifying release artifacts for $VERSION ..."
          Write-Host "=========================================="

          # Sanity check the resolved step output. The earlier "Read
          # Canonical Launcher Version" step writes to $GITHUB_OUTPUT
          # using -NoNewline, which can glue the next key into this one
          # (e.g. "version=1.2.10" + "tag=v1.2.10" becomes one line and
          # $VERSION comes out as "1.2.10tag=v1.2.10"). Reject any value
          # that doesn't look like a clean semver MAJOR.MINOR.PATCH so
          # the failure points at the real problem.
          if ($VERSION -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "VERSION ""$VERSION"" is not a clean semver string. The 'Read Canonical Launcher Version' step likely wrote multiple keys to the same line (use a heredoc or remove -NoNewline)."
            exit 1
          }

          $requiredFiles = @(
            "release-notes.md",
            "dist/AbaYa-Track-v${VERSION}.zip",
            "install/AbaYa-Track-Launcher-Setup-${VERSION}.exe",
            "install/AbaYa-Track-Launcher-Setup-${VERSION}.exe.blockmap",
            "install/latest.yml"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              Write-Error "Required artifact missing: $file"
              exit 1
            }
            Write-Host "✓ Found: $file"
          }

          # Sanity: the latest.yml should reference this exact version
          $yml = Get-Content 'install/latest.yml' -Raw
          if ($yml -notmatch "version: $([regex]::Escape($VERSION))") {
            Write-Error "install/latest.yml does not reference version $VERSION"
            exit 1
          }
          Write-Host "✓ latest.yml references version $VERSION"

          Write-Host ""
          Write-Host "All release artifacts verified successfully."

      # ----------------------------------------------------------
      # UPLOAD BUILD ARTIFACTS
      # ----------------------------------------------------------
      # Always upload so the build survives a failed publish step.
      # Without this, a publish failure loses the entire build and the
      # operator has to wait for the next push to main before retrying.
      # The operator can re-run the failed publish job after fixing
      # GH_PAT (or GITHUB_TOKEN) and `gh release create` will pick up
      # these preserved artifacts from the same run.
      - name: 📤 Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v${{ steps.version.outputs.version }}-launcher-build
          path: |
            install/AbaYa-Track-Launcher-Setup-${{ steps.version.outputs.version }}.exe
            install/AbaYa-Track-Launcher-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            install/latest.yml
            dist/AbaYa-Track-v${{ steps.version.outputs.version }}.zip
            release-notes.md
          retention-days: 30
          if-no-files-found: error


      # ----------------------------------------------------------
      # PUBLISH GITHUB RELEASE
      # ----------------------------------------------------------

      - name: 🚀 Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |

          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Sanity: if $GITHUB_OUTPUT was written with -NoNewline, the
          # `tag` key gets glued to the previous `version` line and
          # both come out wrong. Catch that here before we create a
          # release with an empty tag.
          if [ -z "$TAG" ] || ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: STEP_OUTPUT_INVALID version='$VERSION' tag='$TAG'"
            echo "The 'Read Canonical Launcher Version' step is miswiring \$GITHUB_OUTPUT."
            exit 1
          fi

          echo "=========================================="
          echo "Publishing GitHub Release"
          echo "Version: $VERSION"
          echo "Tag:     $TAG"
          echo "Commit:  $GITHUB_SHA"
          echo "=========================================="

          # electron-builder writes to install/ (per directories.output).
          # The portable ZIP lives at dist/AbaYa-Track-v<version>.zip.
          # If a release with this tag already exists (re-run after a
          # failed first run), we replace its assets in place.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing assets"
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --title "AbaYa Track Launcher $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest \
            "install/AbaYa-Track-Launcher-Setup-${VERSION}.exe" \
            "install/AbaYa-Track-Launcher-Setup-${VERSION}.exe.blockmap" \
            "install/latest.yml" \
            "dist/AbaYa-Track-v${VERSION}.zip"


      # ----------------------------------------------------------
      # FINAL RELEASE VERIFICATION
      # ----------------------------------------------------------

      - name: ✅ Verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |

          TAG="${{ steps.version.outputs.tag }}"

          echo "=========================================="
          echo "Verifying GitHub Release"
          echo "=========================================="

          gh release view "$TAG"

          echo ""
          echo "=========================================="
          echo "🚀 RELEASE SUCCESSFUL"
          echo "=========================================="
          echo "Version : $TAG"
          echo "Commit  : $GITHUB_SHA"
          echo "Trigger : $GITHUB_EVENT_NAME"
          echo "=========================================="
