name: Release Desktop Launcher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      ABAYA_UPDATE_CHANNEL: ${{ contains(github.ref_name, 'beta') && 'beta' || 'stable' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Enable Corepack
        run: corepack enable

      - name: Install launcher dependencies
        working-directory: tools/desktop-launcher
        run: yarn install

      - name: Skip release if version already exists
        id: check-release
        shell: bash
        run: |
          version=$(node -p "require('./tools/desktop-launcher/package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Checking for existing GitHub release tag $tag..."
          release=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$tag")
          if echo "$release" | grep -q '"message": "Not Found"'; then
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish signed launcher
        if: steps.check-release.outputs.release_exists == 'false'
        working-directory: tools/desktop-launcher
        run: yarn release:gh

      - name: Release already exists
        if: steps.check-release.outputs.release_exists == 'true'
        run: echo "Release for version ${{ steps.check-release.outputs.version }} already exists. Skipping publish."
