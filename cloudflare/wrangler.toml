name = "abaya-track"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── Timezone for factory day boundaries and hourly charts ───────────────────
[vars]
FACTORY_TZ = "Asia/Dubai"

# ─── Secrets (set automatically by DEPLOY.ps1, or manually below) ────────────
# Run from the cloudflare\ folder:
#   npx wrangler secret put INGEST_SECRET
#   npx wrangler secret put CEO_TOKEN
#
# INGEST_SECRET — shared key between factory server (.env CF_INGEST_SECRET) and this worker
# CEO_TOKEN     — the CEO's login password (they type this at the dashboard login page)

# ─── D1 Database (filled in automatically by DEPLOY.ps1) ────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "abaya-db"
database_id   = "REPLACE_AFTER_RUNNING_DEPLOY"

# ─── R2 Bucket (for end-of-day report storage) ───────────────────────────────
[[r2_buckets]]
binding     = "EXPORTS"
bucket_name = "abaya-exports"

# ─── Cron — auto EOD summary at 6pm Dubai time every day ────────────────────
[triggers]
crons = ["0 14 * * *"]
