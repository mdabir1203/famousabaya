name = "abaya-track"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "cac65f11aecab7f7dc4446390d49f4f2"

# ─── Custom domain — CEO dashboard lives at https://dashboard.farewellabaya.com
# Cloudflare manages DNS and TLS automatically. No manual DNS record needed.
[[routes]]
pattern = "dashboard.farewellabaya.com"
custom_domain = true

# ─── Timezone for factory day boundaries and hourly charts ───────────────────
[vars]
FACTORY_TZ = "Asia/Dubai"
# Used when catalog rows have no Process column (factory Excel at watch root).
DEFAULT_CATALOG_PROCESS = "Tailor (01)"
# Set to "1" after enabling Cloudflare Access on dashboard.* — Worker trusts Cf-Access-Authenticated-User-Email; CEO_TOKEN still works when header absent (e.g. wrangler dev).
REQUIRE_CF_ACCESS = "0"

# ─── Secrets (set automatically by DEPLOY.ps1, or manually below) ────────────
# Run from the cloudflare\ folder:
#   npx wrangler secret put INGEST_SECRET
#   npx wrangler secret put CEO_TOKEN
#
# INGEST_SECRET — shared key between factory server (.env CF_INGEST_SECRET) and this worker
# CEO_TOKEN     — the CEO's login password (they type this at the dashboard login page)

# ─── D1 Database (filled in automatically by DEPLOY.ps1) ────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "abaya-db"
database_id   = "5d61fb15-2ead-491b-80e2-fe2b2fd46d23"

# ─── R2 Bucket (for end-of-day report storage) ───────────────────────────────
# NOTE: Enable R2 in Cloudflare Dashboard first, then uncomment:
# [[r2_buckets]]
# binding     = "EXPORTS"
# bucket_name = "abaya-exports"

# ─── Cron — auto EOD summary at 6pm Dubai time every day ────────────────────
[triggers]
crons = ["0 14 * * *"]

# ─── Rate limits (Workers Rate Limiting API — unique namespace_id per binding) ─
[[ratelimits]]
name = "INGEST_RATE_LIMIT"
namespace_id = "18701"
  [ratelimits.simple]
  limit = 3000
  period = 60

[[ratelimits]]
name = "CATALOG_PUT_RATE_LIMIT"
namespace_id = "18702"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "CEO_READ_RATE_LIMIT"
namespace_id = "18703"
  [ratelimits.simple]
  limit = 800
  period = 60
